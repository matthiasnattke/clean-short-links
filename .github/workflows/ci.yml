# Checks every push to dev, beta and main and every pull request.
name: Checks

on:
  push:
    branches: [dev, beta, main]
  pull_request:
    branches: [dev, beta, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} – syntax and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php
      - uses: actions/setup-node@v5
        if: matrix.php == '8.2'
        with:
          node-version: '20'
      - name: QR encoder tests
        if: matrix.php == '8.2'
        run: node tests/qr.test.js

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Template up to date, translations complete
        run: node tools/i18n.js check

  wordpress-org:
    name: WordPress.org – guidelines and Plugin Check
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Build the plugin as it is shipped
        run: |
          mkdir -p build
          git archive --format=tar --prefix=clean-short-links/ HEAD | tar -x -C build
      - name: Plugin guidelines (detailed-plugin-guidelines)
        run: node tools/guidelines.js build/clean-short-links --online
      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/clean-short-links
